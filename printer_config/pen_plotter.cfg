# Pen-plotter mode for the Elegoo Neptune 4 (Klipper).
# Installed as ~/klipper_config/pen_plotter.cfg; printer.cfg pulls it in with
# the line  [include pen_plotter.cfg]  (added by ~/pen/pen_mode_on.sh, removed
# by ~/pen/pen_mode_off.sh). Needs [force_move] enable_force_move: True, which
# the stock Neptune 4 config already has.

# Homing is skipped: real homing would lower the head onto the bed and crash
# the pen. The printer is told it is at X100 Y100 Z100 without moving.
[gcode_macro G28]
rename_existing: G28.1
description: Pen mode - pretend to home without moving
gcode:
  SET_KINEMATIC_POSITION X=100 Y=100 Z=100
  M117 Pen mode: homing skipped

# The printer never really homes, so its position is only a count.
# Wide limits stop that count from blocking moves the bed can really make.
[stepper_x]
position_min: -1000
position_max: 1000
homing_positive_dir: False

[stepper_y]
position_min: -1000
position_max: 1000
homing_positive_dir: False

[stepper_z]
position_min: -1000
position_max: 1000
homing_positive_dir: False
